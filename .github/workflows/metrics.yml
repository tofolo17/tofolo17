# Generates metrics.svg (languages, activity, isometric calendar) once a day
# and commits it to this repository, where README.md reads it.
name: Metrics
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: tofolo17
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_ignored: jupyter notebook, html, css, scss, batchfile, dockerfile
          plugin_languages_details: percentage
          plugin_isocalendar: yes
          output_action: commit
          filename: metrics.svg

# Draws the contribution-graph snake (light and dark) once a day and publishes
# it to the "output" branch.
name: Snake
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: tofolo17
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
